# Example target-domain dataset YAML for --data in stage0/stage1/stage2 scripts.
# This is a TEMPLATE (paths below are examples) — the original repo does not
# ship dataset YAMLs, so this file documents the expected format. Copy it,
# rename per domain-shift (e.g. s2c_example.yaml, k2c_example.yaml,
# c2b_example.yaml), and point `path` at wherever you place the dataset
# (see "Chuẩn bị dữ liệu" in README_RTSFOD_LITE.md for the on-disk layout).

path: ../datasets/foggy_cityscapes   # root dir, relative to this file's location
train: images/train                  # target-domain UNLABELED images used for self-training
val: images/val                      # used only for monitoring mAP (paper reports target-domain mAP)

# 8 classes, order must match label files' class indices (Cityscapes/Foggy Cityscapes convention)
names:
  0: person
  1: rider
  2: car
  3: truck
  4: bus
  5: train
  6: motorcycle
  7: bicycle
