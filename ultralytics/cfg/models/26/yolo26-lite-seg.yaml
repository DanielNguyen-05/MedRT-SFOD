# RT-SFOD-Lite extension — AGPL-3.0 License (inherits from Ultralytics)
#
# YOLO26-Lite-Seg: same backbone swap as yolo26-lite.yaml (C3k2 -> C2fFaster,
# FasterNet-style Partial Convolution), but with the Segment26 head from
# yolo26-seg.yaml instead of Detect. This is the Try 3 starting point:
# instance segmentation on the lightweight backbone.
#
# NOTE: this is architecture-only groundwork. DHF's non-overlap fusion step
# (Eq. 2 of the RT-SFOD paper) currently ranks candidates by box IoU; using
# this config for source-free mask self-training requires extending DHF to
# use mask-IoU instead of/alongside box-IoU for de-duplication (see Try 3 in
# README_RTSFOD_LITE.md) — not yet implemented. This YAML only guarantees the
# model builds and forward-passes; it does not include a MARD/DHF-aware
# self-training loop for masks.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone: identical to yolo26-lite.yaml
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2fFaster, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2fFaster, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2fFaster, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2fFaster, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head: identical to yolo26-seg.yaml, only the final line differs from yolo26-lite.yaml
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Segment26, [nc, 32, 256]] # Segment26(P3, P4, P5)
