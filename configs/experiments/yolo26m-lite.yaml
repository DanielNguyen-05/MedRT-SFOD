# RT-SFOD-Lite — corrected C2fFaster argument mapping.
#
# IMPORTANT: C2fFaster follows C2f positional args after the parser inserts n:
#   (c1, c2, n, shortcut, g, e, n_div=4, mlp_ratio=2.0)
# C3k2 instead uses (c1, c2, n, c3k, e, attn, g, shortcut).
# Therefore a direct textual replacement like [256, False, 0.25] is WRONG for
# C2fFaster: 0.25 would become g and e would silently remain 0.5.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  # Match the baseline early-stage expansion e=0.25 explicitly.
  - [-1, 2, C2fFaster, [256, False, 1, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C2fFaster, [512, False, 1, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  # Later stages use e=0.5; shortcut=True is an explicit design choice for
  # FasterNetBlock (it is not the C3k2 `c3k=True` flag).
  - [-1, 2, C2fFaster, [512, True, 1, 0.5]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C2fFaster, [1024, True, 1, 0.5]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

# Keep the original YOLO26 neck/head unchanged so DHF/MARD semantics are
# isolated from Try 1.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16 P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 19 P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 P5/32

  - [[16, 19, 22], 1, Detect, [nc]]
